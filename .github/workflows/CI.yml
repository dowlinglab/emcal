name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly run on the default branch.
    - cron: "0 8 * * 1"

jobs:
  # Fast, dependency-light tests: the core package imports without the GP backend
  # (gpflow/TensorFlow load lazily), so these run on a plain pip install across Python
  # versions and give quick signal.
  fast:
    name: Fast tests (core only), Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (core + dev)
        run: python -m pip install -e ".[dev]"
      - name: Run fast tests
        run: pytest -m "not slow" -v --color=yes

  # Full suite including the slow end-to-end GP tests. Pinned to the validated
  # gpflow 2.9.1 / TensorFlow 2.15 stack (Python 3.10). The slow tests use methods
  # 1/3/7 on CS1 only, so neither Tasmanian (sparse grid) nor Pyomo (Müller) is needed.
  gpflow:
    name: Full suite (gpflow backend), Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package (gpflow + dev)
        run: python -m pip install -e ".[gpflow,dev]"
      - name: Run full test suite
        run: pytest -v --color=yes --cov=emcal --cov-report=xml
